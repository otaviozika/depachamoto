databases:
  - name: despachefull-staging-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: despachefull-staging
    runtime: node
    plan: free
    region: oregon
    branch: staging
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: STAGING_SAFE_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: despachefull-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: stagingadmin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador Homologacao
      - key: DB_POOL_MAX
        value: "10"
      - key: IFOOD_ENABLED
        value: "false"
      - key: IFOOD_DISPATCH_ENABLED
        value: "false"
      - key: IFOOD_ENVIRONMENT
        value: test
      - key: ANOTAAI_ENABLED
        value: "false"
