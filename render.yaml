# Configuração do serviço de produção no Render, igual à do painel
# (serviço "despachefull", endereço https://depachamoto.onrender.com).
#
# Este arquivo documenta o serviço; ele não está ligado a um Blueprint. Se um
# Blueprint for criado a partir dele, os valores abaixo não alteram nada do que
# já roda: segredos e chaves de ativação usam "sync: false", ou seja, o Render
# pede o valor no painel e nunca sobrescreve um valor existente.
services:
  - type: web
    name: despachefull
    runtime: node
    region: oregon
    plan: starter            # 0,5 CPU e 512 MB; o plano gratuito dorme sem tráfego e para o polling do iFood
    numInstances: 1
    buildCommand: npm install
    startCommand: npm start  # só "node server.js": o código não é mais alterado na inicialização
    healthCheckPath: /api/live
    autoDeploy: true         # publica a cada commit na main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador
      - key: IFOOD_ENABLED
        sync: false
      - key: IFOOD_DISPATCH_ENABLED
        sync: false
      - key: IFOOD_ENVIRONMENT
        sync: false
      - key: IFOOD_CLIENT_ID
        sync: false
      - key: IFOOD_CLIENT_SECRET
        sync: false
      - key: IFOOD_CUSTOMER_ID
        sync: false
      - key: IFOOD_MERCHANT_ID
        sync: false
      - key: ANOTAAI_ENABLED
        sync: false
      - key: ANOTAAI_CLIENT_ID
        sync: false
      - key: ANOTAAI_CLIENT_SECRET
        sync: false
      - key: ANOTAAI_PAGE_ID
        sync: false
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      # Opcionais (padrões seguros no código; ver README, "Banco de dados"):
      # DATABASE_SSL_VERIFY, DB_STATEMENT_TIMEOUT_MS, DB_IDLE_IN_TRANSACTION_TIMEOUT_MS
