services:
  - type: web
    name: despachamoto
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador
      - key: IFOOD_CUSTOMER_ID
        sync: false

      - key: IFOOD_MERCHANT_ID
        sync: false
      - key: ANOTAAI_ENABLED
        value: "false"
      - key: ANOTAAI_CLIENT_ID
        sync: false
      - key: ANOTAAI_CLIENT_SECRET
        sync: false
      - key: ANOTAAI_PAGE_ID
        sync: false
