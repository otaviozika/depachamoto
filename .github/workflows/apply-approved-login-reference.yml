name: Apply approved desktop login

on:
  push:
    branches:
      - fix/login-desktop-approved-reference
    paths:
      - '.github/scripts/apply-approved-login-reference.py'
      - '.github/workflows/apply-approved-login-reference.yml'
      - 'public/login-approved-reference.jpg'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-desktop-approved-reference
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply approved reference
        run: python .github/scripts/apply-approved-login-reference.py
      - name: Validate server syntax
        run: node --check server.js
      - name: Install dependencies
        run: npm install
      - name: Validate authentication/session contracts
        run: |
          npm run selftest:rebrand
          npm run selftest:session-expiry
          npm run selftest:sober-ui
          npm run selftest:dashboard-theme
      - name: Validate desktop-only contract
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('public/index.html').read_text()
          assert 'desktop login approved reference — 2026-09-14' in h
          assert "url('/login-approved-reference.jpg')" in h
          assert h.count('id="loginForm"') == 1
          assert h.count('id="registerForm"') == 1
          assert '@media (min-width:901px)' in h
          print('PASS desktop approved reference contract')
          PY
      - name: Commit generated app files
        run: |
          if git diff --quiet -- public/index.html public/service-worker.js; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/service-worker.js
          git commit -m 'fix: aplica referência aprovada no login desktop'
          git push origin HEAD:fix/login-desktop-approved-reference
