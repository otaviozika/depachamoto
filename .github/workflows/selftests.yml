name: DespacheFull selftests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Aplicar fonte do Passo 3
        run: node scripts/step3-source-transform.mjs
      - run: node --check server.js
      - name: Testes de regressão e rotas
        run: |
          for test in scripts/selftest-*.js; do node "$test"; done
