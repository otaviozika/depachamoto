name: DespacheFull selftests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node --check server.js
      - name: Testes de regressão e rotas
        run: |
          failed=0
          for test in scripts/selftest-*.js; do
            echo "::group::$test"
            node "$test" || failed=$((failed+1))
            echo "::endgroup::"
          done
          echo "Failed test scripts: $failed"
          test "$failed" -eq 0
