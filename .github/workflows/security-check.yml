name: Security and regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and refresh lockfile
        run: npm install --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax checks
        run: |
          node --check server.js
          node --check scripts/apply-late-shift-dispatch.js
          node --check scripts/apply-payment-longe.js
      - name: Payment and shift regression tests
        run: |
          npm run selftest:payments
          npm run selftest:shift-control
