name: Security and regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Complete regression on production preparation
        run: npm run test:regression
      - name: Syntax checks
        run: |
          node --check server.js
          node --check scripts/apply-late-shift-dispatch.js
          node --check scripts/apply-payment-longe.js
          node --check public/service-worker.js
          node --check scripts/selftest-bandwidth-stage1.js
      - name: Upload isolated regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-regression
          path: artifacts/regression/
