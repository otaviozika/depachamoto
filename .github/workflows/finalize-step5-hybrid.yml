name: Finalize Step5 hybrid finance
on:
  push:
    branches: [feat/work-shifts-step5]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/work-shifts-step5, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch final source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.js'); s=p.read_text()
          s=s.replace('import { getCurrentOperationalShift, getSPDateTime, normalizeShiftCode, operationalShiftAt, shiftLabel } from "./lib/operational-shift.js";','import { getCurrentOperationalShift, getSPDateTime, normalizeShiftCode, operationalShiftAt, resolveDispatchShift, shiftLabel } from "./lib/operational-shift.js";',1)
          s=s.replace('''    const recoveredShift=getCurrentOperationalShift(new Date(departedAt));\n    if(!recoveredShift) throw Object.assign(new Error('O horário informado não pertence a um turno operacional.'),{status:409,code:'OUTSIDE_OPERATIONAL_SHIFT'});''','''    const recoveredShift=resolveDispatchShift({departedAt,recovery:true,recoveryShiftCode:null});''',1)
          start=s.index('async function getCourierPaymentPeriodShifts(')
          end=s.index('function summarizeCourierPaymentShifts',start)
          old=s[start:end]
          new=old.replace("WHERE d.courier_id=$1 AND d.operational_date BETWEEN $2::date AND $3::date AND d.shift_code IS NOT NULL GROUP BY 1,2","WHERE d.courier_id=$1 AND d.operational_date BETWEEN GREATEST($2::date,$4::date) AND $3::date AND d.shift_code IS NOT NULL GROUP BY 1,2")
          new=new.replace("WHERE courier_id=$1 AND attendance_date BETWEEN $2::date AND $3::date AND shift_code IS NOT NULL","WHERE courier_id=$1 AND attendance_date BETWEEN GREATEST($2::date,$4::date) AND $3::date AND shift_code IS NOT NULL")
          new=new.replace("WHERE courier_id=$1 AND payment_date BETWEEN $2::date AND $3::date AND shift_code IS NOT NULL","WHERE courier_id=$1 AND payment_date BETWEEN GREATEST($2::date,$4::date) AND $3::date AND shift_code IS NOT NULL")
          new=new.replace("`,[courier.id,startDate,endDate])).rows;","`,[courier.id,startDate,endDate,WORK_SHIFT_CUTOVER_DATE])).rows;",1)
          legacy="""  const legacyRows=(await pool.query(`WITH deliveries AS (SELECT (d.departed_at AT TIME ZONE 'America/Sao_Paulo')::date payment_date,COUNT(o.id)::int delivery_count FROM dispatches d JOIN dispatch_orders o ON o.dispatch_id=d.id WHERE d.courier_id=$1 AND (d.departed_at AT TIME ZONE 'America/Sao_Paulo')::date BETWEEN $2::date AND LEAST($3::date,($4::date-1)) GROUP BY 1), worked AS (SELECT payment_date FROM deliveries UNION SELECT payment_date FROM courier_payments WHERE courier_id=$1 AND shift_code IS NULL AND payment_date BETWEEN $2::date AND LEAST($3::date,($4::date-1))) SELECT to_char(w.payment_date,'YYYY-MM-DD') summary_date,NULL::text shift_code,COALESCE(d.delivery_count,0)::int live_delivery_count,p.* FROM worked w LEFT JOIN deliveries d ON d.payment_date=w.payment_date LEFT JOIN courier_payments p ON p.courier_id=$1 AND p.payment_date=w.payment_date AND p.shift_code IS NULL ORDER BY w.payment_date`,[courier.id,startDate,endDate,WORK_SHIFT_CUTOVER_DATE])).rows;\n"""
          new=new.replace('async function getCourierPaymentPeriodShifts(courier,startDate,endDate) {\n','async function getCourierPaymentPeriodShifts(courier,startDate,endDate) {\n'+legacy,1)
          new=new.replace('  const out=[]; for(const row of rows){','  rows.unshift(...legacyRows);\n  const out=[]; for(const row of rows){',1)
          s=s[:start]+new+s[end:]
          p.write_text(s)

          t=Path('scripts/selftest-ifood-order-days.js'); x=t.read_text()
          anchor="  getCurrentOperationalShift: () => ({ operational_date: today, shift_code: 'LUNCH', shift_label: 'Almoço' }),\n"
          resolver="  resolveDispatchShift: ({ departedAt, recoveryShiftCode }) => { const d=new TestDate(departedAt); const h=Number(new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',hour:'2-digit',hourCycle:'h23'}).format(d)); const code=recoveryShiftCode || (h < 16 ? 'LUNCH' : 'DINNER'); return { operational_date:d.toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'}), shift_code:code, shift_label:code==='LUNCH'?'Almoço':'Janta' }; },\n"
          assert anchor in x
          x=x.replace(anchor,anchor+resolver,1)
          t.write_text(x)
          PY
      - name: Validate
        run: |
          npm install
          node --check server.js
          for test in scripts/selftest-*.js; do node "$test"; done
      - name: Commit
        run: |
          rm .github/workflows/finalize-step5-hybrid.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve legacy payment history across shift cutover"
          git push origin HEAD:feat/work-shifts-step5
