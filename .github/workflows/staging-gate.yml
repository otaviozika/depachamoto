name: Staging release gate

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: despachefull_staging
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d despachefull_staging"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/despachefull_staging
      ADMIN_USERNAME: stagingadmin
      ADMIN_NAME: Administrador Homologacao
      NODE_ENV: test
      APP_ENV: staging
      STAGING_SAFE_MODE: "true"
      IFOOD_ENABLED: "true"
      IFOOD_DISPATCH_ENABLED: "true"
      IFOOD_ENVIRONMENT: production
      IFOOD_CLIENT_ID: staging-fake-client
      IFOOD_CLIENT_SECRET: staging-fake-secret
      IFOOD_MERCHANT_ID: staging-fake-merchant
      ANOTAAI_ENABLED: "true"
      ANOTAAI_CLIENT_ID: staging-fake-client
      ANOTAAI_CLIENT_SECRET: staging-fake-secret
      PORT: "3000"
      DB_POOL_MAX: "20"
      TARGET_URL: http://127.0.0.1:3000
      LOADTEST_ADMIN_USERNAME: stagingadmin
      LOAD_TEST_CONFIRM: STAGING_ONLY_I_UNDERSTAND
      COURIERS: "8"
      DEPARTURES_PER_COURIER: "3"
      OPERATIONAL_NOW_OVERRIDE: "2026-09-29T15:00:00Z"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Prepare ephemeral staging secrets
        shell: bash
        run: |
          SESSION_SECRET="$(openssl rand -hex 32)"
          ADMIN_PASSWORD="Stg-$(openssl rand -hex 24)"
          LOAD_TEST_KEY="$(openssl rand -hex 24)"
          echo "::add-mask::$SESSION_SECRET"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "::add-mask::$LOAD_TEST_KEY"
          {
            echo "SESSION_SECRET=$SESSION_SECRET"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "LOADTEST_ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "LOAD_TEST_KEY=$LOAD_TEST_KEY"
          } >> "$GITHUB_ENV"

      - name: Install
        run: npm install

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Static and regression gates
        run: |
          node --check server.js
          node scripts/selftest-staging-safety.js
          failed=0
          for test in scripts/selftest-*.js; do
            echo "::group::$test"
            node "$test" || failed=$((failed+1))
            echo "::endgroup::"
          done
          echo "Failed test scripts: $failed"
          test "$failed" -eq 0

      - name: Apply production prestart transformations
        run: npm run prestart

      - name: Start isolated staging app
        run: |
          node server.js > staging-server.log 2>&1 &
          echo $! > staging-server.pid

      - name: Wait for health and assert safe mode
        run: |
          for i in {1..60}; do
            CODE=$(curl -sS -o health.json -w "%{http_code}" --max-time 5 http://127.0.0.1:3000/api/health || true)
            if [ "$CODE" = "200" ]; then
              node -e '
                const fs=require("fs");
                const h=JSON.parse(fs.readFileSync("health.json","utf8"));
                if(!h.ok) throw new Error("health not ok");
                if(h.environment!=="staging") throw new Error("APP_ENV is not staging");
                if(h.stagingSafeMode!==true) throw new Error("STAGING_SAFE_MODE is not active");
                if(h.externalMutationsAllowed!==false) throw new Error("external mutations are not blocked");
                if(h.ifood.eventSyncEnabled!==false) throw new Error("iFood sync must be disabled in staging");
                if(h.ifood.dispatchFlagEnabled!==false) throw new Error("iFood dispatch must be disabled in staging");
                if(h.anotaai.automaticSyncEnabled!==false) throw new Error("Anota AI sync must be disabled in staging");
                if(h.status!=="healthy") throw new Error("clean staging health must be healthy: "+JSON.stringify(h));
                if(h.components?.database?.status!=="healthy") throw new Error("database health must be healthy");
                if(h.components?.queues?.status!=="healthy") throw new Error("queue health must be healthy");
                if(h.components?.integrations?.status!=="protected") throw new Error("staging integrations must be protected");
                if(h.components?.realtime?.status!=="healthy") throw new Error("realtime engine must be healthy");
                if(!Array.isArray(h.criticalReasons)||h.criticalReasons.length!==0) throw new Error("unexpected critical health reasons");
                console.log("PASS - staging runtime safety + operational health");
              '
              exit 0
            fi
            sleep 2
          done
          echo "Staging app did not become healthy."
          tail -250 staging-server.log || true
          exit 1

      - name: Critical-flow smoke under concurrency
        run: node scripts/smoke-staging-gate.js

      - name: Summary
        if: always()
        run: |
          echo "## DespacheFull staging release gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- APP_ENV=staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- STAGING_SAFE_MODE=true" >> "$GITHUB_STEP_SUMMARY"
          echo "- External integrations forced off" >> "$GITHUB_STEP_SUMMARY"
          echo "- 8 motoboys × 3 ciclos administrativos" >> "$GITHUB_STEP_SUMMARY"
          echo "- Idempotência do client_token validada" >> "$GITHUB_STEP_SUMMARY"
          echo "- Corrida concorrente do mesmo pedido validada" >> "$GITHUB_STEP_SUMMARY"
          if [ -f staging-smoke-report.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat staging-smoke-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: despachefull-staging-gate
          path: |
            health.json
            staging-smoke-report.json
            staging-server.log
          if-no-files-found: ignore

      - name: Stop staging app
        if: always()
        run: |
          if [ -f staging-server.pid ]; then
            kill "$(cat staging-server.pid)" || true
          fi
