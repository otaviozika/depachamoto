name: DespachaMoto - Teste de Carga Seguro

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL do DespachaMoto (ex: https://seu-app.onrender.com)"
        required: true
        type: string
      requests:
        description: "Quantidade total de requisições"
        required: true
        default: "5000"
        type: string
      concurrency:
        description: "Requisições simultâneas"
        required: true
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  health-load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Aquecer serviço
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          echo "Aguardando /api/health responder..."
          for i in {1..30}; do
            CODE=$(curl -sS -o health.json -w "%{http_code}" --max-time 20 "${TARGET_URL%/}/api/health" || true)
            if [ "$CODE" = "200" ]; then
              cat health.json
              echo
              echo "Serviço saudável."
              exit 0
            fi
            echo "Tentativa $i: HTTP $CODE"
            sleep 10
          done
          echo "O serviço não ficou saudável a tempo."
          exit 1

      - name: Rodar teste de carga seguro
        env:
          TARGET_URL: ${{ inputs.target_url }}
          REQUESTS: ${{ inputs.requests }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: node scripts/loadtest-health-ci.js

      - name: Publicar resumo
        if: always()
        run: |
          if [ -f load-test-report.json ]; then
            echo "## DespachaMoto - Teste de Carga" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat load-test-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Salvar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: despachamoto-health-load-report
          path: load-test-report.json
          if-no-files-found: ignore
