name: Staging hosted read-only smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/smoke-staging-hosted-readonly.mjs
      - scripts/staging-hosted-auth-e2e.js
      - server.js
      - .github/workflows/staging-hosted-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-staging-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check staging-only authenticated E2E
        run: node --check scripts/staging-hosted-auth-e2e.js && node --check server.js
      - name: Validate isolated staging health and access control
        run: node scripts/smoke-staging-hosted-readonly.mjs
