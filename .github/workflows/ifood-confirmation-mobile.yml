name: iFood confirmation mobile browser smoke

on:
  pull_request:
    paths:
      - public/index.html
      - scripts/smoke-ifood-confirmation-mobile.mjs
      - .github/workflows/ifood-confirmation-mobile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install temporary browser test dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test synthetic confirmations on Android Chromium and iPhone WebKit
        run: node scripts/smoke-ifood-confirmation-mobile.mjs
