name: Hotfix Step5 final production safety
on:
  push:
    branches:
      - hotfix/step5-final-safety
permissions:
  contents: write
jobs:
  harden-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/step5-final-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply missing Step5 safety layer
        run: python3 scripts/finalize-step5-safety.py
      - name: Apply production hardening
        run: python3 scripts/hotfix-step5-final.py
      - name: Install dependencies
        run: npm install
      - name: Validate source and regressions
        run: |
          git diff --check
          node --check server.js
          for test in scripts/selftest-*.js; do
            echo "=== $test ==="
            node "$test"
          done
      - name: Remove temporary materializers
        run: |
          rm -f scripts/finalize-step5-safety.py
          rm -f scripts/hotfix-step5-final.py
          rm -f .github/workflows/finalize-step5-safety.yml
          rm -f .github/workflows/finalize-step5-hybrid.yml
          rm -f .github/workflows/hotfix-step5-final.yml
      - name: Commit validated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize Step5 production safety"
          git push origin HEAD:hotfix/step5-final-safety
