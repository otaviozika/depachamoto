name: Materialize Step 5 finance source
on:
  push:
    branches: [feat/work-shifts-step5]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/work-shifts-step5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize source
        run: |
          sed -i 's/re.subn(pattern,repl,text/re.subn(pattern,lambda m: repl,text/' scripts/apply-step5-finance-source.py
          python3 scripts/apply-step5-finance-source.py
          sed -i 's/operationalShiftAt(departedAt)/getCurrentOperationalShift(new Date(departedAt))/g; s/operationalShiftAt(effectiveDeparture)/getCurrentOperationalShift(new Date(effectiveDeparture))/g' server.js
          # Legacy VM selftest extracts this helper without module imports.
          sed -i "s/const shift=normalizeShiftCode(shiftCode);/const shift=['LUNCH','DINNER'].includes(String(shiftCode||'').trim().toUpperCase())?String(shiftCode).trim().toUpperCase():null;/" server.js
      - name: Validate syntax and tests
        run: |
          npm install
          node --check server.js
          for test in scripts/selftest-*.js; do node "$test"; done
      - name: Remove one-shot materializer
        run: |
          rm scripts/apply-step5-finance-source.py
          rm .github/workflows/materialize-step5.yml
      - name: Commit definitive source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize step 5 payments by shift"
          git push origin HEAD:feat/work-shifts-step5
