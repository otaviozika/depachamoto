name: Build premium desktop login

on:
  push:
    branches:
      - feat/login-desktop-premium
    paths:
      - .github/workflows/login-desktop-premium.yml
      - .github/scripts/apply-login-desktop.py

permissions:
  contents: write

jobs:
  build-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/login-desktop-premium
          fetch-depth: 0

      - name: Download licensed motorcycle photo
        run: |
          curl --fail --location --retry 3 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Ducati_Panigale_V4_R_%283%29.jpg/1280px-Ducati_Panigale_V4_R_%283%29.jpg' --output public/login-motorcycle.jpg
          test -s public/login-motorcycle.jpg

      - name: Apply desktop-only login redesign
        run: python .github/scripts/apply-login-desktop.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression checks
        run: |
          node --check server.js
          npm run selftest:rebrand
          npm run selftest:session-expiry
          npm run selftest:sober-ui
          npm run selftest:dashboard-theme

      - name: Commit generated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/service-worker.js public/login-motorcycle.jpg public/login-media-attribution.txt
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add premium desktop login'
          git push origin HEAD:feat/login-desktop-premium
