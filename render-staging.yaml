services:
  - type: web
    name: despachefull-staging
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/otaviozika/depachamoto
    branch: staging
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: despachefull-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: stagingadmin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador Homologacao
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: STAGING_SAFE_MODE
        value: "true"
      - key: DB_POOL_MAX
        value: "10"
